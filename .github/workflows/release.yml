name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --bin ox --target ${{ matrix.target }}

      - name: Package release asset (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          TAG_NAME="${{ github.ref_name }}"
          PKG_NAME="ox-${TAG_NAME}-${{ matrix.target }}"
          mkdir -p "${PKG_NAME}/completions"
          cp target/${{ matrix.target }}/release/ox "${PKG_NAME}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "${PKG_NAME}/"
          
          # Generate completions
          target/${{ matrix.target }}/release/ox completions bash > "${PKG_NAME}/completions/ox.bash"
          target/${{ matrix.target }}/release/ox completions zsh > "${PKG_NAME}/completions/_ox"
          target/${{ matrix.target }}/release/ox completions fish > "${PKG_NAME}/completions/ox.fish"
          target/${{ matrix.target }}/release/ox completions powershell > "${PKG_NAME}/completions/_ox.ps1"
          
          tar -czvf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Package release asset (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $TagName = "${{ github.ref_name }}"
          $PkgName = "ox-${TagName}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "$PkgName/completions" -Force
          Copy-Item "target/${{ matrix.target }}/release/ox.exe" -Destination "$PkgName/"
          Copy-Item "README.md", "LICENSE-MIT", "LICENSE-APACHE" -Destination "$PkgName/"
          
          # Generate completions
          & "target/${{ matrix.target }}/release/ox.exe" completions powershell | Out-File -FilePath "$PkgName/completions/_ox.ps1" -Encoding utf8
          & "target/${{ matrix.target }}/release/ox.exe" completions bash | Out-File -FilePath "$PkgName/completions/ox.bash" -Encoding utf8
          & "target/${{ matrix.target }}/release/ox.exe" completions zsh | Out-File -FilePath "$PkgName/completions/_ox" -Encoding utf8
          & "target/${{ matrix.target }}/release/ox.exe" completions fish | Out-File -FilePath "$PkgName/completions/ox.fish" -Encoding utf8
          
          Compress-Archive -Path "$PkgName" -DestinationPath "${PkgName}.zip" -Force
          $Hash = (Get-FileHash -Algorithm SHA256 "${PkgName}.zip").Hash.ToLower()
          "$Hash  ${PkgName}.zip" | Out-File -FilePath "${PkgName}.zip.sha256" -Encoding ascii

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ox-*.tar.gz
            ox-*.tar.gz.sha256
            ox-*.zip
            ox-*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
